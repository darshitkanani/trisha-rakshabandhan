<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6f91">
<title>For Trisha ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff5f6,#ffe1ea,#fff7f0);color:#512633;font-family:Arial,sans-serif}
.page{min-height:100vh;padding:18px 12px}.frame{max-width:560px;margin:auto;min-height:calc(100vh - 36px);border:8px solid #fff;border-radius:28px;background:#fff9fbdd;box-shadow:0 18px 55px #73233d29;overflow:hidden}
.top{text-align:center;padding:34px 20px 18px}.small{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#bd607a;font-weight:bold}
h1{font-family:cursive;font-size:56px;line-height:1;margin:8px 0;color:#a92f55}.subtitle{font-size:15px;color:#704754}.name{font-family:cursive;font-size:27px;color:#e05a7b;margin-top:5px}.heartline{font-size:22px;margin-top:8px}
.gifts{padding:18px;display:grid;gap:15px}.gift{width:100%;min-height:108px;border:1px solid #ffd2de;border-radius:23px;background:linear-gradient(135deg,#fff,#fff0f4);box-shadow:0 10px 24px #8630491f;display:flex;align-items:center;text-align:left;padding:14px 17px;cursor:pointer;transition:.2s}.gift:active{transform:scale(.98)}
.gift-icon{font-size:50px;margin-right:15px}.gift h2{font-family:cursive;font-size:29px;margin:0 0 2px;color:#a72e55}.gift p{font-size:12px;margin:0;color:#8a626d}.hint{text-align:center;color:#9d7180;font-size:12px;padding:0 20px 20px}.signature{text-align:center;font-family:cursive;font-size:25px;color:#b6335b;padding-bottom:25px}
.modal{position:fixed;inset:0;background:#360f1c99;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}.modal.open{display:flex}
.card{width:min(520px,100%);max-height:92vh;overflow:auto;background:#fff9fa;border-radius:28px;padding:23px 18px;position:relative;box-shadow:0 25px 80px #0005;animation:pop .3s ease}@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.close{position:absolute;right:12px;top:11px;border:0;background:#ffe5eb;color:#9d3655;width:36px;height:36px;border-radius:50%;font-size:21px}.modal-title{text-align:center;font-family:cursive;color:#aa2f55;font-size:42px;margin:6px 30px 4px}.modal-sub{text-align:center;color:#85616c;font-size:13px;margin-bottom:16px}
.wish{background:linear-gradient(135deg,#fff0f4,#fff);border:1px solid #ffd4df;border-radius:22px;padding:24px 19px;text-align:center}.wish .big{font-size:52px}.wish h3{font-family:cursive;font-size:35px;margin:5px;color:#c53862}.wish p{line-height:1.7;color:#694653}.rakhi{font-size:40px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:9px}.gallery img{width:100%;height:210px;object-fit:cover;border-radius:17px;display:block}.gallery img:first-child{grid-column:span 2;height:300px}
.letter{background:#fffdf8;border:1px solid #f0d9bd;border-radius:20px;padding:23px 20px;font-family:cursive;font-size:24px;line-height:1.5;color:#5d3b42}.salute{font-size:32px;color:#ad3155}.from{text-align:right;font-size:29px;color:#c03d62;margin-top:15px}.footer{text-align:center;color:#a16676;font-size:11px;margin-top:16px}
.float{position:fixed;pointer-events:none;z-index:30;font-size:20px;animation:up 2.7s ease-out forwards}@keyframes up{0%{transform:translateY(0) scale(.7);opacity:0}15%{opacity:1}100%{transform:translateY(-150px) rotate(25deg);opacity:0}}
.confetti{position:fixed;width:8px;height:12px;z-index:40;pointer-events:none;animation:fall 1.7s linear forwards}@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:0}}
@media(max-width:390px){h1{font-size:48px}.gift h2{font-size:26px}.gallery img{height:175px}.gallery img:first-child{height:250px}.letter{font-size:22px}}
</style>
</head>
<body>
<div class="page"><div class="frame">
<section class="top"><div class="small">A little surprise for</div><h1>Trisha ❤️</h1><div class="subtitle">Each gift has something special for you...</div><div class="name">Open them one by one ✨</div><div class="heartline">🎀 💗 🎁 💗 🎀</div></section>
<section class="gifts">
<button class="gift" onclick="openGift(1)"><div class="gift-icon">🎁</div><div><h2>Gift One</h2><p>A little Rakshabandhan wish just for you 💕</p></div></button>
<button class="gift" onclick="openGift(2)"><div class="gift-icon">📸</div><div><h2>Gift Two</h2><p>Some memories that are too precious to forget ✨</p></div></button>
<button class="gift" onclick="openGift(3)"><div class="gift-icon">💌</div><div><h2>Gift Three</h2><p>A message from your favourite brother ❤️</p></div></button>
</section>
<div class="hint">Tap a gift to open it • You can revisit them anytime</div>
<div class="signature">Made with lots of love — અંગ્રેજી medium ❤️</div>
</div></div>
<div class="modal" id="modal" onclick="outsideClose(event)"><div class="card"><button class="close" onclick="closeGift()">×</button><div id="content"></div></div></div>
<script>
const modal=document.getElementById("modal"),content=document.getElementById("content");
function openGift(n){
if(n===1)content.innerHTML=`<div class="modal-title">Happy Rakshabandhan ❤️</div><div class="modal-sub">For the most special sister, Trisha</div><div class="wish"><div class="big">🫂</div><h3>Happy Rakshabandhan!</h3><p>Some bonds are made by birth, but become priceless because of all the little moments we share.</p><p>Today is just a reminder that no matter how much we grow up, you'll always be my little sister and one of the most important people in my life. 💕</p><div class="rakhi">🪢 ❤️ 🪢</div></div>`;
if(n===2)content.innerHTML=`<div class="modal-title">Our Memories 📸</div><div class="modal-sub">A tiny collection of moments with you ❤️</div><div class="gallery"><img src="memories.gif" alt="Animated memories" loading="lazy">${[1,2,3,4,5,6,7,8,9].map(i=>`<img src="photo${i}.jpg" alt="Memory ${i}" loading="lazy">`).join("")}</div><div class="footer">Every picture has a story. Every story has you. 💗</div>`;
if(n===3)content.innerHTML=`<div class="modal-title">A Message For You 💌</div><div class="modal-sub">From your brother, અંગ્રેજી medium ❤️</div><div class="letter"><div class="salute">Hey bro,</div>Wishing you a happy rakshabandhan 🫂❤️. Missing you the most today.<br><br>Thank you for being my best guide in life and always supporting me. I wish may God fulfill all your wishes 💕<br><br>I will always be there for you.<br>Love you lots ❤️<div class="from">અંગ્રેજી medium ❤️</div></div>`;
modal.classList.add("open");document.body.style.overflow="hidden";hearts();if(n===1)confetti();
}
function closeGift(){modal.classList.remove("open");document.body.style.overflow=""}
function outsideClose(e){if(e.target===modal)closeGift()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeGift()});
function hearts(){for(let i=0;i<8;i++)setTimeout(()=>{let e=document.createElement("div");e.className="float";e.textContent=["❤️","💕","✨","💗"][Math.floor(Math.random()*4)];e.style.left=(10+Math.random()*80)+"vw";e.style.top=(60+Math.random()*30)+"vh";document.body.appendChild(e);setTimeout(()=>e.remove(),2800)},i*90)}
function confetti(){for(let i=0;i<45;i++)setTimeout(()=>{let c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.top="-15px";c.style.background=["#ff6f91","#ffd166","#cdb4db","#90dbf4","#ff9f9f"][Math.floor(Math.random()*5)];document.body.appendChild(c);setTimeout(()=>c.remove(),1800)},i*18)}
</script>

<style>
.song-box{margin:24px auto;padding:20px;max-width:520px;text-align:center;border-radius:22px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px)}
#songBtn{border:0;border-radius:999px;padding:14px 22px;font-size:17px;font-weight:700;cursor:pointer}
#songStatus{margin:10px 0 0;opacity:.85}
</style>
<div class="song-box">
  <button id="songBtn" type="button">🎵 Play our song ❤️</button>
  <audio id="rakhiSong" src="Tenu%20Sang%20Rakhna.mp3" preload="metadata"></audio>
  <p id="songStatus">Tap to play our song</p>
</div>
<script>
(() => {
  const audio=document.getElementById('rakhiSong');
  const btn=document.getElementById('songBtn');
  const status=document.getElementById('songStatus');
  btn.addEventListener('click',async()=>{
    if(audio.paused){
      try{await audio.play();btn.textContent='⏸️ Pause our song ❤️';status.textContent='Playing our song… 🎵';}
      catch(e){status.textContent='Tap again to play the song 🎵';}
    }else{audio.pause();btn.textContent='🎵 Play our song ❤️';status.textContent='Song paused';}
  });
  audio.addEventListener('ended',()=>{btn.textContent='🎵 Play our song ❤️';status.textContent='Tap to play again';});
})();
</script>

</body>
</html>
